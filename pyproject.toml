[project]
name = "old-man-yells-at-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "httpx>=0.28.1",
    "pillow>=11.2.1",
    "cairosvg>=2.7.1",
    "numpy>=1.24.0",
    "fastapi-cli>=0.0.7",
    "fastapi-cloud-cli>=0.1.0",
    "beautifulsoup4>=4.13.4",
]

[[tool.uv.index]]
url = "https://pypi.python.org/simple"

[[tool.uv.index]]
url = "https://fastapi-cli.pages.dev/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "inline-snapshot>=0.15.0",
    "respx>=0.21.1",
    "ruff>=0.8.4",
    "pyright>=1.1.390",
    "pre-commit>=4.0.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]  # Allow function calls in test fixtures

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
exclude = [
    "**/__pycache__",
    ".venv",
]
